services:
  backend:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - ../:/workspace
    command: bash -lc "python -m pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - ../:/workspace
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
