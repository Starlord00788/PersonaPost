services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: personapost
      POSTGRES_USER: personapost
      POSTGRES_PASSWORD: personapost
    ports:
      - "5432:5432"
    volumes:
      - personapost_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personapost -d personapost"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: python:3.12-slim
    working_dir: /workspace/backend
    volumes:
      - ../:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg://personapost:personapost@postgres:5432/personapost
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_GENERATION_MODEL: ${GROQ_GENERATION_MODEL:-llama-3.3-70b-versatile}
      GROQ_REVIEW_MODEL: ${GROQ_REVIEW_MODEL:-llama-3.1-8b-instant}
      MIN_APPROVAL_SCORE: ${MIN_APPROVAL_SCORE:-75}
    depends_on:
      postgres:
        condition: service_healthy
    command: bash -lc "python -m pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    volumes:
      - ../:/workspace
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

volumes:
  personapost_postgres_data:
